name: Build iPhone app

on:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios-build.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build (unsigned)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project WifiHeatmap.xcodeproj \
            -scheme WifiHeatmap \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tee build.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Build/Products/Release-iphoneos/WifiHeatmap.app

      - name: Package .ipa
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/WifiHeatmap.app Payload/
          zip -qry WifiHeatmap-unsigned.ipa Payload

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: WifiHeatmap-unsigned-ipa
          path: ios/WifiHeatmap-unsigned.ipa

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ios/build.log
