name: WifiHeatmap
options:
  bundleIdPrefix: com.wifisurvey
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  WifiHeatmap:
    type: application
    platform: iOS
    sources:
      - WifiHeatmap
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wifisurvey.heatmap
        PRODUCT_NAME: WifiHeatmap
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: NO
    info:
      path: WifiHeatmap/Info.plist
      properties:
        CFBundleDisplayName: WiFi Map
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities:
          - arkit
        NSCameraUsageDescription: The camera is used to scan rooms and to track where you are while measuring Wi-Fi.
        NSLocalNetworkUsageDescription: Speed tests can run against a computer on your own network for pure Wi-Fi measurements.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
