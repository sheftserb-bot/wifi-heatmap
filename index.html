<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="WiFi Map">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>WiFi Heatmap</title>
<style>
:root{--bg:#f3f4f6;--panel:#ffffff;--text:#15171c;--muted:#6b7280;--line:#e1e4e9;--accent:#2563eb;--danger:#dc2626;--chip:#eceff3}
@media (prefers-color-scheme: dark){:root{--bg:#0e1014;--panel:#171a20;--text:#e8eaee;--muted:#9aa1ad;--line:#2a2f38;--accent:#4f8cff;--danger:#f05252;--chip:#232831}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:15px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;overscroll-behavior:none}
body{display:flex;flex-direction:column;height:100vh;height:100dvh;-webkit-user-select:none;user-select:none}
header{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:17px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:flex;background:var(--chip);border-radius:9px;padding:2px}
.seg button{border:0;background:transparent;color:var(--text);padding:6px 10px;border-radius:7px;font:inherit;font-size:13px}
.seg button.on{background:var(--panel);box-shadow:0 1px 2px rgba(0,0,0,.18);font-weight:600}
#wrap{flex:1;position:relative;min-height:0;display:flex}
#view{flex:1;overflow:auto;position:relative;-webkit-overflow-scrolling:touch}
#stage{position:relative;margin:0 auto}
#cv{display:block}
#legend{position:absolute;left:10px;top:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 8px;font-size:11px;color:var(--muted);box-shadow:0 1px 4px rgba(0,0,0,.15);pointer-events:none;width:150px}
#legend .bar{height:8px;border-radius:4px;background:linear-gradient(90deg,#d7191c,#f17c4a,#fdc35f,#c4e47d,#1a9641);margin:4px 0}
#legend .lbl{display:flex;justify-content:space-between}
.zoom{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:42px;height:42px;border-radius:21px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-size:20px;box-shadow:0 1px 4px rgba(0,0,0,.2)}
#empty{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;text-align:center;color:var(--muted)}
#empty .btn{max-width:280px}
#status{padding:8px 12px;background:var(--panel);border-top:1px solid var(--line);font-size:14px;min-height:48px}
#status .big{font-size:19px;font-weight:700;color:var(--text)}
#status .sub{color:var(--muted);font-size:13px}
nav{display:grid;grid-template-columns:repeat(5,1fr);background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{border:0;background:none;color:var(--muted);font:inherit;font-size:11px;padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button .i{font-size:21px;line-height:1}
nav button.on{color:var(--accent);font-weight:600}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.42);display:none;align-items:flex-end;z-index:10}
.sheet.open{display:flex}
.card{background:var(--panel);width:100%;max-width:560px;margin:0 auto;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:88dvh;overflow:auto;-webkit-user-select:text;user-select:text}
.card h2{margin:0 0 8px;font-size:18px}
.card h3{margin:16px 0 4px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.btn{display:block;width:100%;border:0;border-radius:11px;padding:12px;margin:8px 0 0;font:inherit;font-weight:600;background:var(--chip);color:var(--text);text-align:center}
.btn.primary{background:var(--accent);color:#fff}
.btn.danger{color:var(--danger)}
.row{display:flex;gap:8px;align-items:center;margin:6px 0}
.row label{flex:1;font-size:14px}
.row input[type=number]{width:84px}
input[type=number],input[type=text],select{font:inherit;font-size:16px;padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text)}
input[type=text]{width:100%}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:15px}
.kv b{font-weight:600}
.muted{color:var(--muted);font-size:13px}
</style>
</head>
<body>
<header>
  <h1 id="title">WiFi Heatmap</h1>
  <div class="seg" id="metricSeg">
    <button data-m="down">↓ Down</button><button data-m="up">↑ Up</button><button data-m="lat">Ping</button>
  </div>
</header>

<div id="wrap">
  <div id="view"><div id="stage"><canvas id="cv"></canvas></div></div>
  <div id="legend"><div id="lgTitle">Download</div><div class="bar"></div><div class="lbl"><span id="lgBad"></span><span id="lgGood"></span></div></div>
  <div class="zoom"><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">−</button><button id="zfit" aria-label="Fit">⤢</button></div>
  <div id="empty">
    <div style="font-size:42px">📶</div>
    <div>Load a floor plan (photo, screenshot or image), or survey on a blank grid.</div>
    <button class="btn primary" data-act="pickPlan">Choose floor plan image</button>
    <button class="btn" data-act="blankGrid">Use blank grid</button>
    <button class="btn" data-act="importJson">Open saved survey</button>
  </div>
</div>

<div id="status"></div>

<nav>
  <button data-tool="plan"><span class="i">🗺️</span>Plan</button>
  <button data-tool="scale"><span class="i">📏</span>Scale</button>
  <button data-tool="start"><span class="i">🚩</span>Start</button>
  <button data-tool="measure"><span class="i">📍</span>Measure</button>
  <button data-tool="menu"><span class="i">⋯</span>More</button>
</nav>

<input type="file" id="planFile" accept="image/*" hidden>
<input type="file" id="jsonFile" accept=".json,application/json" hidden>

<!-- Plan sheet -->
<div class="sheet" id="shPlan"><div class="card">
  <h2>Floor plan</h2>
  <div class="muted">Changing the plan clears the points, scale and start point.</div>
  <button class="btn primary" data-act="pickPlan">Choose image</button>
  <button class="btn" data-act="blankGrid">Use blank grid</button>
  <button class="btn" data-act="close">Cancel</button>
</div></div>

<!-- Point sheet -->
<div class="sheet" id="shPoint"><div class="card">
  <h2>Measurement</h2>
  <div class="kv" id="ptInfo"></div>
  <button class="btn primary" data-act="retest">Test again here</button>
  <button class="btn danger" data-act="delPoint">Delete point</button>
  <button class="btn" data-act="close">Close</button>
</div></div>

<!-- Menu sheet -->
<div class="sheet" id="shMenu"><div class="card">
  <h2>Survey</h2>
  <div class="row"><input type="text" id="inName" placeholder="Survey name"></div>

  <h3>Export</h3>
  <button class="btn primary" data-act="exportPng">Share heat map image</button>
  <button class="btn" data-act="exportJson">Save survey file</button>
  <button class="btn" data-act="exportCsv">Export points (CSV)</button>
  <button class="btn" data-act="importJson">Open survey file</button>

  <h3>Test</h3>
  <div class="row"><label>Test server</label>
    <select id="inServer"><option value="auto">Auto</option><option value="local">Local server (Wi-Fi only)</option><option value="cloudflare">Internet (Cloudflare)</option></select></div>
  <div class="row"><label>Seconds per test (down / up)</label>
    <select id="inSecs"><option value="2">2</option><option value="3">3</option><option value="5">5</option></select></div>
  <div class="muted" id="serverInfo"></div>

  <h3>Display</h3>
  <div class="row"><label for="inHeat">Show heat map</label><input type="checkbox" id="inHeat"></div>
  <div class="row"><label for="inLabels">Show values on points</label><input type="checkbox" id="inLabels"></div>

  <h3>Colour scale (bad → good)</h3>
  <div class="row"><label>Download Mbps</label><input type="number" id="thDownBad" inputmode="decimal"><input type="number" id="thDownGood" inputmode="decimal"></div>
  <div class="row"><label>Upload Mbps</label><input type="number" id="thUpBad" inputmode="decimal"><input type="number" id="thUpGood" inputmode="decimal"></div>
  <div class="row"><label>Ping ms</label><input type="number" id="thLatBad" inputmode="decimal"><input type="number" id="thLatGood" inputmode="decimal"></div>

  <h3>Reset</h3>
  <button class="btn danger" data-act="clearPoints">Clear all points</button>
  <button class="btn danger" data-act="newSurvey">New survey (clear everything)</button>
  <button class="btn" data-act="close">Done</button>
</div></div>

<script>
'use strict';
const $ = s => document.querySelector(s);
const KEY = 'wifiheat.v1', KEYPLAN = 'wifiheat.plan.v1';
const DEF_TH = { down: { bad: 10, good: 300 }, up: { bad: 5, good: 100 }, lat: { bad: 60, good: 5 } };
const METRIC = {
  down: { name: 'Download', unit: 'Mbps', key: 'down' },
  up:   { name: 'Upload',   unit: 'Mbps', key: 'up' },
  lat:  { name: 'Ping',     unit: 'ms',   key: 'lat' }
};
const clone = o => JSON.parse(JSON.stringify(o));

let S = {
  name: 'My survey', planKind: null, w: 0, h: 0,
  pxPerM: null, scalePts: null, scaleM: null, start: null, points: [],
  metric: 'down', showHeat: true, showLabels: true, server: 'auto', secs: 3, th: clone(DEF_TH)
};
let planImg = null, planURL = null;
let tool = 'measure', zoom = 1, busy = false, pending = null, tmpScale = [];
let heatCache = null, heatKey = '';
let selPoint = null, wakeLock = null;

const view = $('#view'), stage = $('#stage'), cv = $('#cv'), ctx = cv.getContext('2d');

/* ---------- storage ---------- */
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function savePlan() {
  try { planURL ? localStorage.setItem(KEYPLAN, planURL) : localStorage.removeItem(KEYPLAN); }
  catch (e) { flash('Plan image is too large to keep in the browser. Use “Save survey file” to keep it.'); }
}
async function loadState() {
  try {
    const j = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (j) { S = Object.assign(S, j); S.th = Object.assign(clone(DEF_TH), j.th || {}); }
  } catch (e) {}
  if (S.planKind === 'image') {
    let url = null;
    try { url = localStorage.getItem(KEYPLAN); } catch (e) {}
    if (url) await setPlanURL(url); else S.planKind = null;
  }
}

/* ---------- plan ---------- */
function setPlanURL(url) {
  return new Promise(res => {
    const im = new Image();
    im.onload = () => { planImg = im; planURL = url; S.planKind = 'image'; S.w = im.naturalWidth; S.h = im.naturalHeight; res(true); };
    im.onerror = () => res(false);
    im.src = url;
  });
}
function resetSurveyGeometry() {
  S.points = []; S.start = null; S.pxPerM = null; S.scalePts = null; S.scaleM = null; tmpScale = [];
}
function confirmReplace() {
  return !(S.points.length || S.start) || confirm('Replace the plan? Points, scale and start point will be cleared.');
}
async function loadPlanFile(file) {
  const src = URL.createObjectURL(file);
  const im = new Image();
  await new Promise((ok, bad) => { im.onload = ok; im.onerror = bad; im.src = src; }).catch(() => null);
  URL.revokeObjectURL(src);
  if (!im.naturalWidth) { flash('Could not open that image.'); return; }
  const max = 2400, k = Math.min(1, max / Math.max(im.naturalWidth, im.naturalHeight));
  const c = document.createElement('canvas');
  c.width = Math.round(im.naturalWidth * k); c.height = Math.round(im.naturalHeight * k);
  const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
  g.drawImage(im, 0, 0, c.width, c.height);
  resetSurveyGeometry();
  await setPlanURL(c.toDataURL('image/jpeg', 0.85));
  savePlan(); save(); fit(); setTool('scale');
}
function useBlankGrid() {
  resetSurveyGeometry();
  planImg = null; planURL = null; S.planKind = 'grid'; S.w = 1600; S.h = 1100;
  savePlan(); save(); fit(); setTool('start');
}

/* ---------- colours / values ---------- */
const RAMP = [[0, [215, 25, 28]], [0.25, [241, 124, 74]], [0.5, [253, 195, 95]], [0.75, [196, 228, 125]], [1, [26, 150, 65]]];
function ramp(t) {
  for (let i = 1; i < RAMP.length; i++) {
    if (t <= RAMP[i][0]) {
      const [t0, a] = RAMP[i - 1], [t1, b] = RAMP[i], f = (t - t0) / (t1 - t0);
      return [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f, a[2] + (b[2] - a[2]) * f];
    }
  }
  return RAMP[RAMP.length - 1][1];
}
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function valOf(p, m = S.metric) { if (p.fail) return null; const v = p[METRIC[m].key]; return (v == null || !isFinite(v)) ? null : v; }
function norm(m, v) {
  if (v == null) return 0;
  const th = S.th[m];
  if (m === 'lat') return clamp((th.bad - v) / (th.bad - th.good || 1), 0, 1);
  const lb = Math.log(Math.max(th.bad, 0.01)), lg = Math.log(Math.max(th.good, 0.02));
  return clamp((Math.log(Math.max(v, 0.01)) - lb) / (lg - lb || 1), 0, 1);
}
function fmt(v, m) {
  if (v == null || !isFinite(v)) return '–';
  if (m === 'lat') return v < 10 ? v.toFixed(1) : Math.round(v).toString();
  return v < 10 ? v.toFixed(1) : Math.round(v).toString();
}
const rgb = c => `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})`;

/* ---------- heat map ---------- */
function getHeat() {
  if (!S.points.length) return null;
  const key = JSON.stringify([S.metric, S.points.map(p => [p.x, p.y, valOf(p)]), S.th[S.metric], S.w, S.h, S.pxPerM]);
  if (heatCache && key === heatKey) return heatCache;
  const cols = Math.max(40, Math.min(240, Math.round(S.w / 8)));
  const cell = S.w / cols, rows = Math.max(1, Math.ceil(S.h / cell));
  const oc = document.createElement('canvas'); oc.width = cols; oc.height = rows;
  const og = oc.getContext('2d'), id = og.createImageData(cols, rows), d = id.data;
  const R = S.pxPerM ? S.pxPerM * 5 : Math.max(S.w, S.h) * 0.12;   // full-colour radius around points
  const pts = S.points.map(p => ({ x: p.x, y: p.y, t: norm(S.metric, valOf(p)) }));
  for (let y = 0; y < rows; y++) {
    const cy = (y + 0.5) * cell;
    for (let x = 0; x < cols; x++) {
      const cx = (x + 0.5) * cell;
      let ws = 0, vs = 0, dmin = Infinity, exact = -1;
      for (let i = 0; i < pts.length; i++) {
        const dx = cx - pts[i].x, dy = cy - pts[i].y, d2 = dx * dx + dy * dy;
        if (d2 < 1) { exact = i; dmin = 0; break; }
        const w = 1 / d2; ws += w; vs += w * pts[i].t;
        if (d2 < dmin) dmin = d2;
      }
      const t = exact >= 0 ? pts[exact].t : vs / ws;
      const dist = Math.sqrt(dmin);
      const a = dist <= R ? 1 : dist >= 2 * R ? 0 : 1 - (dist - R) / R;
      const c = ramp(t), o = (y * cols + x) * 4;
      d[o] = c[0]; d[o + 1] = c[1]; d[o + 2] = c[2]; d[o + 3] = Math.round(a * 255);
    }
  }
  og.putImageData(id, 0, 0);
  heatCache = oc; heatKey = key;
  return oc;
}

/* ---------- drawing ---------- */
function drawScene(c, w, h, u, exporting) {
  // u = image pixels per "marker unit" (keeps markers a constant on-screen size)
  if (S.planKind === 'image' && planImg) c.drawImage(planImg, 0, 0, w, h);
  else {
    c.fillStyle = '#ffffff'; c.fillRect(0, 0, w, h);
    c.strokeStyle = '#e6e9ee'; c.lineWidth = 1;
    const step = S.pxPerM ? S.pxPerM : 50;
    c.beginPath();
    for (let x = 0; x <= w; x += step) { c.moveTo(x, 0); c.lineTo(x, h); }
    for (let y = 0; y <= h; y += step) { c.moveTo(0, y); c.lineTo(w, y); }
    c.stroke();
  }
  if (S.showHeat) {
    const hc = getHeat();
    if (hc) { c.save(); c.globalAlpha = 0.58; c.imageSmoothingEnabled = true; c.imageSmoothingQuality = 'high'; c.drawImage(hc, 0, 0, w, h); c.restore(); }
  }
  // scale line
  const sp = tool === 'scale' && !exporting ? (tmpScale.length ? tmpScale : (S.scalePts || [])) : [];
  if (sp.length) {
    c.save(); c.strokeStyle = '#2563eb'; c.fillStyle = '#2563eb'; c.lineWidth = 3 * u; c.setLineDash([8 * u, 6 * u]);
    if (sp.length === 2) { c.beginPath(); c.moveTo(sp[0].x, sp[0].y); c.lineTo(sp[1].x, sp[1].y); c.stroke(); }
    c.setLineDash([]);
    sp.forEach(p => { c.beginPath(); c.arc(p.x, p.y, 6 * u, 0, Math.PI * 2); c.fill(); });
    if (sp.length === 2 && S.scaleM && !tmpScale.length) label(c, `${S.scaleM.toFixed(2)} m`, (sp[0].x + sp[1].x) / 2, (sp[0].y + sp[1].y) / 2 - 12 * u, u, '#2563eb');
    c.restore();
  }
  // start flag
  if (S.start) {
    const { x, y } = S.start;
    c.save(); c.lineWidth = 2.5 * u; c.strokeStyle = '#111'; c.fillStyle = '#7c3aed';
    c.beginPath(); c.moveTo(x, y); c.lineTo(x, y - 26 * u); c.stroke();
    c.beginPath(); c.moveTo(x, y - 26 * u); c.lineTo(x + 16 * u, y - 20.5 * u); c.lineTo(x, y - 15 * u); c.closePath(); c.fill();
    c.beginPath(); c.arc(x, y, 3.5 * u, 0, Math.PI * 2); c.fillStyle = '#111'; c.fill();
    c.restore();
  }
  // points
  c.save();
  for (const p of S.points) {
    const v = valOf(p), col = rgb(ramp(norm(S.metric, v)));
    c.beginPath(); c.arc(p.x, p.y, 8 * u, 0, Math.PI * 2);
    c.fillStyle = col; c.fill(); c.lineWidth = 2.5 * u; c.strokeStyle = '#fff'; c.stroke();
    c.lineWidth = 1 * u; c.strokeStyle = 'rgba(0,0,0,.45)'; c.stroke();
    if (p === selPoint && !exporting) { c.beginPath(); c.arc(p.x, p.y, 13 * u, 0, Math.PI * 2); c.lineWidth = 2.5 * u; c.strokeStyle = '#2563eb'; c.stroke(); }
    if (S.showLabels) label(c, p.fail ? '✕' : fmt(v, S.metric), p.x + 12 * u, p.y, u, '#111', 'left');
  }
  c.restore();
  if (pending && !exporting) {
    c.save(); c.beginPath(); c.arc(pending.x, pending.y, 11 * u, 0, Math.PI * 2);
    c.setLineDash([4 * u, 4 * u]); c.lineWidth = 3 * u; c.strokeStyle = '#2563eb'; c.stroke(); c.restore();
  }
}
function label(c, txt, x, y, u, color, align = 'center') {
  c.save(); c.font = `700 ${13 * u}px -apple-system, system-ui, sans-serif`; c.textAlign = align; c.textBaseline = 'middle';
  c.lineJoin = 'round'; c.lineWidth = 4 * u; c.strokeStyle = 'rgba(255,255,255,.95)'; c.strokeText(txt, x, y);
  c.fillStyle = color; c.fillText(txt, x, y); c.restore();
}

function sizeStage() {
  stage.style.width = (S.w * zoom) + 'px'; stage.style.height = (S.h * zoom) + 'px';
  cv.style.width = (S.w * zoom) + 'px'; cv.style.height = (S.h * zoom) + 'px';
}
function render() {
  updateLegend();
  if (!S.planKind) { $('#empty').style.display = 'flex'; cv.width = cv.height = 0; stage.style.width = stage.style.height = '0'; return; }
  $('#empty').style.display = 'none';
  sizeStage();
  const dpr = window.devicePixelRatio || 1;
  let k = dpr * zoom;
  const lim = Math.sqrt(16e6 / (S.w * S.h));        // stay under iOS canvas memory limit
  if (k > lim) k = lim;
  const W = Math.max(1, Math.round(S.w * k)), H = Math.max(1, Math.round(S.h * k));
  if (cv.width !== W || cv.height !== H) { cv.width = W; cv.height = H; }
  ctx.setTransform(k, 0, 0, k, 0, 0);
  ctx.clearRect(0, 0, S.w, S.h);
  drawScene(ctx, S.w, S.h, 1 / zoom, false);
}

/* ---------- zoom ---------- */
function fitZoom() {
  if (!S.w) return 1;
  return Math.min((view.clientWidth - 8) / S.w, (view.clientHeight - 8) / S.h);
}
function fit() { zoom = fitZoom(); render(); view.scrollLeft = 0; view.scrollTop = 0; }
function setZoom(z, cx, cy, light) {
  const zmin = fitZoom() * 0.5, zmax = Math.max(6, fitZoom() * 10);
  z = clamp(z, zmin, zmax);
  const r = view.getBoundingClientRect();
  const fx = (cx ?? r.left + r.width / 2) - r.left, fy = (cy ?? r.top + r.height / 2) - r.top;
  const ix = (view.scrollLeft + fx - stage.offsetLeft) / zoom, iy = (view.scrollTop + fy - stage.offsetTop) / zoom;
  zoom = z;
  if (light) sizeStage(); else render();
  view.scrollLeft = ix * zoom + stage.offsetLeft - fx;
  view.scrollTop = iy * zoom + stage.offsetTop - fy;
}
let g0 = null;
view.addEventListener('gesturestart', e => { e.preventDefault(); g0 = { z: zoom }; });
view.addEventListener('gesturechange', e => { e.preventDefault(); if (g0) setZoom(g0.z * e.scale, e.clientX, e.clientY, true); });
view.addEventListener('gestureend', e => { e.preventDefault(); g0 = null; render(); });
document.addEventListener('gesturestart', e => e.preventDefault());
view.addEventListener('wheel', e => { if (e.ctrlKey) { e.preventDefault(); setZoom(zoom * Math.exp(-e.deltaY / 200), e.clientX, e.clientY); } }, { passive: false });
$('#zin').onclick = () => setZoom(zoom * 1.4);
$('#zout').onclick = () => setZoom(zoom / 1.4);
$('#zfit').onclick = fit;
window.addEventListener('resize', () => render());

/* ---------- tapping on the plan ---------- */
cv.addEventListener('click', e => {
  if (g0) return;
  const r = cv.getBoundingClientRect();
  const x = (e.clientX - r.left) / zoom, y = (e.clientY - r.top) / zoom;
  if (x < 0 || y < 0 || x > S.w || y > S.h) return;
  if (tool === 'scale') return onScaleTap(x, y);
  if (tool === 'start') { S.start = { x, y }; save(); setTool('measure'); flash('Start point set. Stand at a spot, tap it, and hold still while it tests.'); return; }
  if (tool === 'measure') {
    if (busy) return;
    const hit = S.points.find(p => Math.hypot(p.x - x, p.y - y) < 18 / zoom);
    if (hit) return openPoint(hit);
    runTest(x, y, null);
  }
});
function onScaleTap(x, y) {
  tmpScale.push({ x, y });
  render();
  if (tmpScale.length < 2) { flash('Now tap the other end.'); return; }
  setTimeout(() => {
    const ans = prompt('Real distance between the two points?\nMetres (e.g. 4.5) or feet (e.g. 15ft)', '');
    const m = parseDistance(ans);
    if (m) {
      const [a, b] = tmpScale, px = Math.hypot(a.x - b.x, a.y - b.y);
      S.pxPerM = px / m; S.scalePts = tmpScale; S.scaleM = m; save();
      flash(`Scale set: ${m.toFixed(2)} m.`);
      tmpScale = [];
      setTool(S.start ? 'measure' : 'start');
    } else { tmpScale = []; flash('Scale not set. Tap two points again.'); render(); }
  }, 50);
}
function parseDistance(s) {
  if (!s) return null;
  const t = String(s).trim().toLowerCase().replace(',', '.');
  const n = parseFloat(t);
  if (!isFinite(n) || n <= 0) return null;
  return /ft|feet|foot|'/.test(t) ? n * 0.3048 : n;
}

/* ---------- speed testing ---------- */
const sep = u => (u.includes('?') ? '&' : '?');
const bust = u => u + sep(u) + 'r=' + Math.random().toString(36).slice(2);
let epMode = null;
async function endpoints() {
  let mode = S.server;
  if (mode === 'auto') {
    if (epMode == null) {
      epMode = 'cloudflare';
      if (location.protocol.startsWith('http')) {
        try { const r = await fetchT(bust('ping'), {}, 1500); if (r.ok && r.headers.get('x-wifiheat') === '1') epMode = 'local'; } catch (e) {}
      }
    }
    mode = epMode;
  }
  if (mode === 'local') return { mode, ping: 'ping', down: n => `down?bytes=${n}`, up: 'up' };
  return { mode: 'cloudflare', ping: 'https://speed.cloudflare.com/__down?bytes=0', down: n => `https://speed.cloudflare.com/__down?bytes=${n}`, up: 'https://speed.cloudflare.com/__up' };
}
function fetchT(url, opts = {}, ms = 4000) {
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), ms);
  return fetch(url, Object.assign({ cache: 'no-store', signal: ctl.signal }, opts)).finally(() => clearTimeout(t));
}
async function measureLatency(ep, n = 9) {
  const times = [];
  for (let i = 0; i < n; i++) {
    const t0 = performance.now();
    const r = await fetchT(bust(ep.ping), {}, 3000);
    await r.arrayBuffer();
    times.push(performance.now() - t0);
  }
  times.shift();                                   // first request opens the connection
  const s = [...times].sort((a, b) => a - b);
  let jit = 0; for (let i = 1; i < times.length; i++) jit += Math.abs(times[i] - times[i - 1]);
  return { lat: s[Math.floor(s.length / 2)], jit: jit / (times.length - 1) };
}
async function measureDown(ep, secs, onProg) {
  const ctl = new AbortController(), t0 = performance.now(), end = t0 + secs * 1000;
  let bytes = 0, lastProg = 0;
  const worker = async () => {
    while (performance.now() < end) {
      const r = await fetch(bust(ep.down(25e6)), { cache: 'no-store', signal: ctl.signal });
      const rd = r.body.getReader();
      for (;;) {
        const { done, value } = await rd.read();
        if (done) break;
        bytes += value.length;
        const now = performance.now();
        if (now - lastProg > 250) { lastProg = now; onProg && onProg(bytes * 8 / ((now - t0) / 1000) / 1e6); }
        if (now >= end) { ctl.abort(); return; }
      }
    }
  };
  const guard = setTimeout(() => ctl.abort(), secs * 1000 + 1500);
  const res = await Promise.allSettled([worker(), worker(), worker()]);
  clearTimeout(guard);
  const el = (Math.min(performance.now(), end + 1500) - t0) / 1000;
  if (!bytes) throw (res.find(x => x.status === 'rejected') || {}).reason || new Error('no data');
  return bytes * 8 / el / 1e6;
}
let upBlob = null;
function getUpBlob() {
  if (upBlob) return upBlob;
  const a = new Uint8Array(1 << 20);
  for (let i = 0; i < a.length; i += 65536) crypto.getRandomValues(a.subarray(i, i + 65536));
  return (upBlob = new Blob([a]));
}
async function measureUp(ep, secs, onProg) {
  const blob = getUpBlob(), ctl = new AbortController(), t0 = performance.now(), end = t0 + secs * 1000;
  let bytes = 0, last = t0;
  const worker = async () => {
    while (performance.now() < end) {
      const r = await fetch(bust(ep.up), { method: 'POST', body: blob, cache: 'no-store', signal: ctl.signal });
      await r.arrayBuffer();
      bytes += blob.size; last = performance.now();
      onProg && onProg(bytes * 8 / ((last - t0) / 1000) / 1e6);
    }
  };
  const guard = setTimeout(() => ctl.abort(), secs * 3000 + 2000);
  const res = await Promise.allSettled([worker(), worker(), worker()]);
  clearTimeout(guard);
  if (!bytes) throw (res.find(x => x.status === 'rejected') || {}).reason || new Error('no data');
  return bytes * 8 / ((last - t0) / 1000) / 1e6;
}
async function runTest(x, y, existing) {
  busy = true; pending = { x, y }; selPoint = null; render();
  keepAwake();
  const res = { x, y, t: Date.now(), down: null, up: null, lat: null, jit: null, fail: false };
  let ep;
  try {
    ep = await endpoints();
    res.server = ep.mode;
    setStatusHTML(`<div class="big">Testing… ping</div><div class="sub">Hold still · ${ep.mode === 'local' ? 'local server' : 'Cloudflare'}</div>`);
    const L = await measureLatency(ep); res.lat = L.lat; res.jit = L.jit;
    res.down = await measureDown(ep, S.secs, v => setStatusHTML(`<div class="big">↓ ${fmt(v)} Mbps…</div><div class="sub">Hold still · ping ${fmt(res.lat, 'lat')} ms</div>`));
    res.up = await measureUp(ep, S.secs, v => setStatusHTML(`<div class="big">↑ ${fmt(v)} Mbps…</div><div class="sub">Hold still · ↓ ${fmt(res.down)} Mbps</div>`));
  } catch (e) {
    if (res.lat == null) res.fail = true;        // could not reach the server at all = dead spot
    res.err = String((e && e.message) || e);
  }
  if (existing) Object.assign(existing, res);
  else { res.id = Date.now().toString(36) + Math.random().toString(36).slice(2, 5); S.points.push(res); }
  pending = null; busy = false; save(); render();
  if (navigator.vibrate) navigator.vibrate(40);
  showResult(res);
}
async function keepAwake() {
  try { if ('wakeLock' in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => wakeLock = null); } } catch (e) {}
}

/* ---------- UI: status, tools, sheets ---------- */
function setStatusHTML(h) { $('#status').innerHTML = h; }
let flashTimer = null;
function flash(msg) { setStatusHTML(`<div>${esc(msg)}</div>`); clearTimeout(flashTimer); flashTimer = setTimeout(idleStatus, 4500); }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function median(a) { if (!a.length) return null; const s = [...a].sort((x, y) => x - y); const m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; }
function showResult(r) {
  clearTimeout(flashTimer);
  if (r.fail) setStatusHTML(`<div class="big">✕ No connection here</div><div class="sub">Marked as a dead spot. Tap the next spot.</div>`);
  else setStatusHTML(`<div class="big">↓ ${fmt(r.down)} &nbsp;↑ ${fmt(r.up)} Mbps &nbsp;· ${fmt(r.lat, 'lat')} ms</div><div class="sub">Point ${S.points.length} saved${r.err ? ' (partial: ' + esc(r.err) + ')' : ''}. Move and tap the next spot.</div>`);
  flashTimer = setTimeout(idleStatus, 8000);
}
function idleStatus() {
  if (busy) return;
  if (!S.planKind) return setStatusHTML('<div>Load a floor plan to begin.</div>');
  if (tool === 'scale') {
    const cur = S.pxPerM ? `<div class="sub">Current scale: ${S.scaleM.toFixed(2)} m line. Optional, but it makes the map more accurate.</div>` : '<div class="sub">Optional, but it makes the heat spread realistically.</div>';
    return setStatusHTML(`<div>Tap both ends of something you know the length of (a wall, a door).</div>${cur}`);
  }
  if (tool === 'start') return setStatusHTML('<div>Tap where you are starting the survey (e.g. by the router or front door).</div>');
  const ok = S.points.filter(p => !p.fail);
  if (!S.points.length) return setStatusHTML(`<div>Stand at a spot, tap it on the plan, hold still ~${S.secs * 2 + 2} s.</div><div class="sub">Tip: every 3–5 m, and in every room. Tap a point to retest or delete it.</div>`);
  const md = median(ok.map(p => p.down).filter(v => v != null)), mu = median(ok.map(p => p.up).filter(v => v != null)), ml = median(ok.map(p => p.lat).filter(v => v != null));
  const worst = ok.length ? ok.reduce((a, b) => (norm(S.metric, valOf(a)) <= norm(S.metric, valOf(b)) ? a : b)) : null;
  const dead = S.points.length - ok.length;
  setStatusHTML(`<div><b>${S.points.length}</b> points · median ↓ ${fmt(md)} ↑ ${fmt(mu)} Mbps · ${fmt(ml, 'lat')} ms</div>` +
    `<div class="sub">${dead ? dead + ' dead spot' + (dead > 1 ? 's' : '') + ' · ' : ''}${worst ? 'weakest ' + METRIC[S.metric].name.toLowerCase() + ': ' + fmt(valOf(worst), S.metric) + ' ' + METRIC[S.metric].unit : ''}</div>`);
}
function setTool(t) {
  tool = t; tmpScale = t === 'scale' ? [] : tmpScale;
  document.querySelectorAll('nav button[data-tool]').forEach(b => b.classList.toggle('on', b.dataset.tool === tool));
  render(); idleStatus();
}
function updateLegend() {
  document.querySelectorAll('#metricSeg button').forEach(b => b.classList.toggle('on', b.dataset.m === S.metric));
  const m = METRIC[S.metric], th = S.th[S.metric];
  $('#lgTitle').textContent = `${m.name} (${m.unit})`;
  $('#lgBad').textContent = (S.metric === 'lat' ? '≥' : '≤') + th.bad;
  $('#lgGood').textContent = (S.metric === 'lat' ? '≤' : '≥') + th.good;
  $('#legend').style.display = S.planKind && S.points.length ? 'block' : 'none';
  document.querySelector('.zoom').style.display = S.planKind ? 'flex' : 'none';
  $('#title').textContent = S.name || 'WiFi Heatmap';
}
function openSheet(id) { document.querySelectorAll('.sheet').forEach(s => s.classList.remove('open')); if (id) $(id).classList.add('open'); }
function openPoint(p) {
  selPoint = p; render();
  const lines = [];
  if (p.fail) lines.push(['Status', 'No connection (dead spot)']);
  lines.push(['Download', fmt(p.down) + ' Mbps'], ['Upload', fmt(p.up) + ' Mbps'], ['Ping', fmt(p.lat, 'lat') + ' ms'], ['Jitter', fmt(p.jit, 'lat') + ' ms']);
  if (S.start && S.pxPerM) lines.push(['From start', (Math.hypot(p.x - S.start.x, p.y - S.start.y) / S.pxPerM).toFixed(1) + ' m']);
  lines.push(['Tested', new Date(p.t).toLocaleString()], ['Server', p.server === 'local' ? 'Local' : 'Cloudflare']);
  if (p.err) lines.push(['Note', p.err]);
  $('#ptInfo').innerHTML = lines.map(([k, v]) => `<span class="muted">${k}</span><b>${esc(v)}</b>`).join('');
  openSheet('#shPoint');
}
function openMenu() {
  $('#inName').value = S.name || '';
  $('#inServer').value = S.server; $('#inSecs').value = String(S.secs);
  $('#inHeat').checked = S.showHeat; $('#inLabels').checked = S.showLabels;
  $('#thDownBad').value = S.th.down.bad; $('#thDownGood').value = S.th.down.good;
  $('#thUpBad').value = S.th.up.bad; $('#thUpGood').value = S.th.up.good;
  $('#thLatBad').value = S.th.lat.bad; $('#thLatGood').value = S.th.lat.good;
  $('#serverInfo').textContent = 'Local = pure Wi-Fi speed to a computer on your network (run server.py). Internet = speed to Cloudflare, limited by your internet plan.' + (epMode ? ` Auto found: ${epMode === 'local' ? 'local server' : 'Cloudflare'}.` : '');
  openSheet('#shMenu');
}
function readMenu() {
  S.name = $('#inName').value.trim() || 'My survey';
  if (S.server !== $('#inServer').value) epMode = null;
  S.server = $('#inServer').value; S.secs = +$('#inSecs').value || 3;
  S.showHeat = $('#inHeat').checked; S.showLabels = $('#inLabels').checked;
  const num = (id, d) => { const v = parseFloat($(id).value); return isFinite(v) && v > 0 ? v : d; };
  S.th.down = { bad: num('#thDownBad', 10), good: num('#thDownGood', 300) };
  S.th.up = { bad: num('#thUpBad', 5), good: num('#thUpGood', 100) };
  S.th.lat = { bad: num('#thLatBad', 60), good: num('#thLatGood', 5) };
  save(); render(); idleStatus();
}
['#inName', '#inServer', '#inSecs', '#inHeat', '#inLabels', '#thDownBad', '#thDownGood', '#thUpBad', '#thUpGood', '#thLatBad', '#thLatGood']
  .forEach(id => $(id).addEventListener('change', readMenu));

/* ---------- export / import ---------- */
function dataURLtoBlob(u) {
  const [h, b] = u.split(','), mime = h.match(/:(.*?);/)[1], bin = atob(b), a = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
  return new Blob([a], { type: mime });
}
async function shareFile(blob, name) {
  const f = new File([blob], name, { type: blob.type });
  if (navigator.canShare && navigator.canShare({ files: [f] })) {
    try { await navigator.share({ files: [f], title: name }); return; } catch (e) { if (e.name === 'AbortError') return; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 5000);
}
const fileBase = () => (S.name || 'survey').replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '-') || 'survey';
function exportPng() {
  if (!S.planKind) return flash('Nothing to export yet.');
  const k = Math.min(1.5, 2400 / Math.max(S.w, S.h));
  const W = Math.round(S.w * k), H = Math.round(S.h * k), F = Math.round(Math.max(110, W * 0.075));
  const c = document.createElement('canvas'); c.width = W; c.height = H + F;
  const g = c.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0, 0, W, H + F);
  g.save(); g.scale(k, k); drawScene(g, S.w, S.h, Math.max(S.w, S.h) / 1000, true); g.restore();
  // footer
  const m = METRIC[S.metric], th = S.th[S.metric], fs = F / 5.5, pad = fs;
  g.fillStyle = '#15171c'; g.font = `700 ${fs * 1.15}px -apple-system, system-ui, sans-serif`; g.textBaseline = 'top';
  g.fillText(`${S.name} — ${m.name} (${m.unit})`, pad, H + pad * 0.8);
  const ok = S.points.filter(p => !p.fail);
  const md = median(ok.map(p => p.down).filter(v => v != null)), mu = median(ok.map(p => p.up).filter(v => v != null)), ml = median(ok.map(p => p.lat).filter(v => v != null));
  g.font = `400 ${fs * 0.85}px -apple-system, system-ui, sans-serif`; g.fillStyle = '#555';
  g.fillText(`${S.points.length} points · median ↓ ${fmt(md)} / ↑ ${fmt(mu)} Mbps · ping ${fmt(ml, 'lat')} ms · ${new Date().toLocaleDateString()}`, pad, H + pad * 2.4);
  const lw = Math.min(W * 0.32, 420), lx = W - lw - pad, ly = H + pad * 1.0, lh = fs * 0.7;
  const grad = g.createLinearGradient(lx, 0, lx + lw, 0);
  RAMP.forEach(([t, col]) => grad.addColorStop(t, rgb(col)));
  g.fillStyle = grad; g.fillRect(lx, ly, lw, lh);
  g.fillStyle = '#555'; g.font = `400 ${fs * 0.75}px -apple-system, system-ui, sans-serif`;
  g.textAlign = 'left'; g.fillText((S.metric === 'lat' ? '≥' : '≤') + th.bad + ' ' + m.unit, lx, ly + lh + fs * 0.3);
  g.textAlign = 'right'; g.fillText((S.metric === 'lat' ? '≤' : '≥') + th.good + ' ' + m.unit, lx + lw, ly + lh + fs * 0.3);
  shareFile(dataURLtoBlob(c.toDataURL('image/png')), `${fileBase()}-${S.metric}.png`);
}
function exportJson() {
  const data = Object.assign({ app: 'wifi-heatmap', version: 1, plan: planURL }, S);
  shareFile(new Blob([JSON.stringify(data)], { type: 'application/json' }), `${fileBase()}.json`);
}
function exportCsv() {
  const head = 'n,x_px,y_px,x_m,y_m,download_mbps,upload_mbps,ping_ms,jitter_ms,dead_spot,time,server';
  const rows = S.points.map((p, i) => [i + 1, p.x.toFixed(1), p.y.toFixed(1),
    S.pxPerM ? (p.x / S.pxPerM).toFixed(2) : '', S.pxPerM ? (p.y / S.pxPerM).toFixed(2) : '',
    p.down?.toFixed(2) ?? '', p.up?.toFixed(2) ?? '', p.lat?.toFixed(1) ?? '', p.jit?.toFixed(1) ?? '',
    p.fail ? 1 : 0, new Date(p.t).toISOString(), p.server || ''].join(','));
  shareFile(new Blob([[head, ...rows].join('\n')], { type: 'text/csv' }), `${fileBase()}.csv`);
}
async function importJson(file) {
  try {
    const j = JSON.parse(await file.text());
    if (!j || !Array.isArray(j.points)) throw new Error('not a survey file');
    const plan = j.plan; delete j.plan; delete j.app; delete j.version;
    S = Object.assign(S, j); S.th = Object.assign(clone(DEF_TH), j.th || {});
    planImg = null; planURL = null;
    if (S.planKind === 'image' && plan) await setPlanURL(plan); else if (S.planKind === 'image') S.planKind = null;
    savePlan(); save(); openSheet(null); fit(); setTool('measure');
    flash(`Opened “${S.name}” with ${S.points.length} points.`);
  } catch (e) { flash('Could not open that file: ' + e.message); }
}

/* ---------- wiring ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act;
  if (act === 'close') { openSheet(null); selPoint = null; render(); }
  else if (act === 'pickPlan') { if (confirmReplace()) { openSheet(null); $('#planFile').click(); } }
  else if (act === 'blankGrid') { if (confirmReplace()) { openSheet(null); useBlankGrid(); } }
  else if (act === 'importJson') { $('#jsonFile').click(); }
  else if (act === 'exportPng') exportPng();
  else if (act === 'exportJson') exportJson();
  else if (act === 'exportCsv') exportCsv();
  else if (act === 'retest') { const p = selPoint; openSheet(null); if (p && !busy) runTest(p.x, p.y, p); }
  else if (act === 'delPoint') { S.points = S.points.filter(p => p !== selPoint); selPoint = null; save(); openSheet(null); render(); idleStatus(); }
  else if (act === 'clearPoints') { if (confirm('Delete all measurement points?')) { S.points = []; save(); openSheet(null); render(); idleStatus(); } }
  else if (act === 'newSurvey') { if (confirm('Start a new survey? This clears the plan and all points.')) { resetSurveyGeometry(); S.planKind = null; S.name = 'My survey'; planImg = null; planURL = null; savePlan(); save(); openSheet(null); render(); idleStatus(); } }
});
document.querySelectorAll('.sheet').forEach(s => s.addEventListener('click', e => { if (e.target === s) { openSheet(null); selPoint = null; render(); } }));
document.querySelectorAll('nav button[data-tool]').forEach(b => b.addEventListener('click', () => {
  const t = b.dataset.tool;
  if (t === 'plan') return openSheet('#shPlan');
  if (t === 'menu') return openMenu();
  if (!S.planKind) return flash('Load a floor plan or blank grid first.');
  setTool(t);
}));
document.querySelectorAll('#metricSeg button').forEach(b => b.addEventListener('click', () => { S.metric = b.dataset.m; save(); render(); idleStatus(); }));
$('#planFile').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; if (f) loadPlanFile(f); });
$('#jsonFile').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; if (f) importJson(f); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && busy) keepAwake(); });

(async () => {
  await loadState();
  if (S.planKind) { zoom = fitZoom(); }
  setTool(S.planKind ? (S.start ? 'measure' : 'start') : 'measure');
  requestAnimationFrame(() => { if (S.planKind) fit(); });
})();
</script>
</body>
